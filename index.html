<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smash Karts 1v1 Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden selection:bg-yellow-400 selection:text-black">

    <!-- TOP HEADER / PLAYER CREATION BAR -->
    <header class="w-full px-6 py-4 flex justify-between items-center z-20">
        <!-- Top Left: Create Account / Set Username -->
        <div class="flex items-center gap-3 bg-blue-900/40 p-2 pr-4 rounded-2xl border border-white/20 backdrop-blur-md">
            <div class="w-10 h-10 rounded-xl bg-yellow-400 flex items-center justify-center font-black text-blue-950 text-xl shadow-md">
                👤
            </div>
            <div>
                <span class="block text-[10px] font-bold uppercase tracking-wider text-blue-200">Account Username</span>
                <input type="text" id="accountUsername" placeholder="Enter Tag..." oninput="updateAccountName()" class="bg-transparent text-sm font-bold text-white focus:outline-none placeholder-blue-300/60 w-32 sm:w-40">
            </div>
        </div>

        <!-- Top Right: Interactive Online Button -->
        <div class="flex items-center gap-4">
            <button onclick="toggleOnlineModal()" class="flex items-center gap-2 bg-blue-900/60 hover:bg-blue-800/80 border border-white/20 px-4 py-2 rounded-full text-xs font-bold text-emerald-400 transition-all cursor-pointer shadow-md active:scale-95">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                Online: <span id="onlineCount">0</span>
            </button>
        </div>
    </header>

    <!-- MAIN INTERFACE BODY -->
    <div class="flex flex-1 w-full max-w-7xl mx-auto px-4">
        
        <!-- LEFT SIDEBAR ICON MENU -->
        <aside class="flex flex-col gap-4 py-6 pr-4 items-center">
            <button onclick="showTab('leaderboardTab')" title="Most Played Leaderboard" class="sidebar-btn w-12 h-12 rounded-2xl flex items-center justify-center text-xl shadow-lg">
                🏆
            </button>
            <button onclick="showTab('setupTab')" title="Create 1v1 Room" class="sidebar-btn w-12 h-12 rounded-2xl flex items-center justify-center text-xl shadow-lg">
                🎮
            </button>
        </aside>

        <!-- CENTER CONTENT ZONE -->
        <main class="flex-1 flex flex-col items-center">
            
            <!-- LOGO BADGE -->
            <div class="mb-6">
                <div class="bg-gradient-to-b from-yellow-300 to-yellow-500 border-4 border-white rounded-3xl px-10 py-3 shadow-2xl transform -rotate-1">
                    <span class="font-bungee text-5xl sm:text-6xl text-blue-950 drop-shadow-md tracking-wider">1v1</span>
                </div>
            </div>

            <!-- MAP PREVIEWS BANNER -->
            <div class="w-full max-w-4xl overflow-x-auto pb-4 mb-6 flex gap-3 justify-start sm:justify-center no-scrollbar">
                <div class="flex-shrink-0 bg-blue-900/60 border border-white/30 rounded-2xl p-2 text-center w-24">
                    <div class="w-full h-12 bg-purple-900/80 rounded-xl mb-1 flex items-center justify-center text-xs font-bold">👻</div>
                    <span class="text-[10px] font-bold block truncate">Graveyard</span>
                </div>
                <div class="flex-shrink-0 bg-blue-900/60 border border-white/30 rounded-2xl p-2 text-center w-24">
                    <div class="w-full h-12 bg-red-900/80 rounded-xl mb-1 flex items-center justify-center text-xs font-bold">🌋</div>
                    <span class="text-[10px] font-bold block truncate">Lava Pit</span>
                </div>
                <div class="flex-shrink-0 bg-blue-900/60 border border-white/30 rounded-2xl p-2 text-center w-24">
                    <div class="w-full h-12 bg-indigo-900/80 rounded-xl mb-1 flex items-center justify-center text-xs font-bold">🚀</div>
                    <span class="text-[10px] font-bold block truncate">Space Station</span>
                </div>
                <div class="flex-shrink-0 bg-blue-900/60 border border-white/30 rounded-2xl p-2 text-center w-24">
                    <div class="w-full h-12 bg-emerald-900/80 rounded-xl mb-1 flex items-center justify-center text-xs font-bold">☁️</div>
                    <span class="text-[10px] font-bold block truncate">Sky Arena</span>
                </div>
            </div>

            <!-- CONTAINER WINDOW -->
            <div class="w-full max-w-4xl bg-blue-950/40 border-2 border-white/20 backdrop-blur-xl rounded-3xl p-6 shadow-2xl mb-8">
                
                <!-- TAB 1: MOST PLAYED LEADERBOARD -->
                <div id="leaderboardTab" class="tab-content space-y-3">
                    <div class="flex justify-between items-center mb-4 px-2">
                        <h2 class="font-bungee text-xl text-yellow-300">MOST PLAYED PLAYERS</h2>
                        <button onclick="showTab('setupTab')" class="text-xs bg-yellow-400 hover:bg-yellow-300 text-blue-950 font-black px-4 py-2 rounded-xl">
                            + Create Match
                        </button>
                    </div>

                    <div id="leaderboardList" class="space-y-2.5">
                        <!-- Dynamic Player Rows -->
                    </div>
                </div>

                <!-- TAB 2: CREATE 1v1 MATCH SETUP -->
                <div id="setupTab" class="tab-content hidden space-y-6">
                    <div class="text-center mb-4">
                        <h2 class="font-bungee text-2xl text-white">CUSTOM 1v1 MATCH SETUP</h2>
                        <p class="text-xs text-blue-200">Configure your match options below</p>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-blue-200 mb-2">Host Player Name</label>
                            <input type="text" id="hostNameInput" placeholder="Enter Host Name" class="smash-input w-full px-4 py-3 rounded-2xl text-sm font-bold">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-blue-200 mb-2">Smash Karts Private Link</label>
                            <input type="text" id="smashUrl" placeholder="https://smashkarts.io/..." class="smash-input w-full px-4 py-3 rounded-2xl text-sm font-bold">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-blue-200 mb-2">Win Condition</label>
                            <select id="winCondition" class="smash-input w-full px-4 py-3 rounded-2xl text-sm font-bold">
                                <option value="First to 3">First to 3</option>
                                <option value="First to 6">First to 6</option>
                                <option value="First to 10">First to 10</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-blue-200 mb-2">Game Mode</label>
                            <select id="gameMode" class="smash-input w-full px-4 py-3 rounded-2xl text-sm font-bold">
                                <option value="1v1 Deathmatch">⚔️ 1v1 Deathmatch</option>
                                <option value="Arms Race">🚀 Arms Race</option>
                                <option value="Sudden Death">💀 Sudden Death</option>
                            </select>
                        </div>
                    </div>

                    <button onclick="createLobby()" class="btn-smash w-full py-4 rounded-2xl font-bungee text-xl text-white tracking-wider">
                        START 1v1 MATCH
                    </button>

                    <div id="roomDetails" class="hidden p-4 rounded-2xl bg-emerald-500/20 border border-emerald-400 text-emerald-200 text-center font-bold text-xs">
                        Match registered! Room Code: <span id="displayRoomId" class="underline"></span>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- ONLINE PLAYERS MODAL -->
    <div id="onlineModal" class="hidden fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-blue-900 border-2 border-white/30 rounded-3xl p-6 shadow-2xl relative">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bungee text-lg text-yellow-300">🟢 ONLINE PLAYERS</h3>
                <button onclick="toggleOnlineModal()" class="text-white hover:text-red-400 font-bold text-lg">✕</button>
            </div>
            <div id="onlinePlayersList" class="max-h-80 overflow-y-auto space-y-2 pr-1">
                <!-- Online Players Dynamic Content -->
            </div>
        </div>
    </div>

    <!-- DIRECT MESSAGING CHAT BOX -->
    <div id="chatBox" class="hidden fixed bottom-4 right-4 z-50 w-80 bg-blue-950 border-2 border-yellow-400 rounded-2xl shadow-2xl overflow-hidden flex flex-col">
        <div class="bg-blue-900 px-4 py-3 flex justify-between items-center border-b border-white/10">
            <span class="font-bold text-xs text-yellow-300">💬 Chat with: <span id="chatTargetName">Untitled</span></span>
            <button onclick="closeChat()" class="text-white hover:text-red-400 font-bold text-sm">✕</button>
        </div>
        <div id="chatMessages" class="h-56 p-3 overflow-y-auto text-xs space-y-2 bg-blue-950/90">
            <!-- Messages render here -->
        </div>
        <div class="p-2 bg-blue-900/60 border-t border-white/10 flex gap-2">
            <input type="text" id="chatInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendChatMessage()" class="smash-input flex-1 px-3 py-1.5 rounded-xl text-xs">
            <button onclick="sendChatMessage()" class="bg-yellow-400 text-blue-950 font-black px-3 py-1.5 rounded-xl text-xs">Send</button>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="py-4 text-center text-xs font-bold text-blue-200/60">
        Smash Karts 1v1 Arena • Custom Room Manager
    </footer>

    <!-- SCRIPT LOGIC -->
    <script>
        const socket = io();

        let onlineUsers = [];
        let activeChatTargetId = null;

        // Account Username Tracking
        let currentAccount = localStorage.getItem('smashUser') || '';
        if (currentAccount) {
            document.getElementById('accountUsername').value = currentAccount;
            document.getElementById('hostNameInput').value = currentAccount;
            socket.emit('set_username', currentAccount);
        }

        function updateAccountName() {
            const name = document.getElementById('accountUsername').value.trim();
            const displayName = name.length > 0 ? name : "Untitled";
            localStorage.setItem('smashUser', name);
            document.getElementById('hostNameInput').value = displayName;
            socket.emit('set_username', name);
        }

        // Handle Socket Events for Online Users
        socket.on('online_users_update', (data) => {
            document.getElementById('onlineCount').innerText = data.count;
            onlineUsers = data.users;
            renderOnlineModalList();
        });

        function toggleOnlineModal() {
            const modal = document.getElementById('onlineModal');
            modal.classList.toggle('hidden');
        }

        function renderOnlineModalList() {
            const container = document.getElementById('onlinePlayersList');
            container.innerHTML = '';

            onlineUsers.forEach(user => {
                const isMe = user.id === socket.id;
                const row = document.createElement('div');
                row.className = 'flex justify-between items-center bg-blue-950/70 border border-white/10 p-3 rounded-xl';
                
                row.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                        <span class="font-bold text-xs text-white">${user.username}${isMe ? ' (You)' : ''}</span>
                    </div>
                    ${!isMe ? `<button onclick="openChat('${user.id}', '${user.username}')" class="bg-yellow-400 hover:bg-yellow-300 text-blue-950 font-black px-3 py-1 rounded-lg text-[10px] uppercase">Message</button>` : ''}
                `;
                container.appendChild(row);
            });
        }

        // Direct Messaging Logic
        function openChat(targetId, targetName) {
            activeChatTargetId = targetId;
            document.getElementById('chatTargetName').innerText = targetName;
            document.getElementById('chatBox').classList.remove('hidden');
            document.getElementById('onlineModal').classList.add('hidden');
        }

        function closeChat() {
            document.getElementById('chatBox').classList.add('hidden');
            activeChatTargetId = null;
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (message && activeChatTargetId) {
                socket.emit('send_private_msg', {
                    targetSocketId: activeChatTargetId,
                    message: message
                });

                // Render locally
                appendChatMessage("You", message, true);
                input.value = '';
            }
        }

        socket.on('receive_private_msg', (data) => {
            // Automatically open chat box when receiving a message
            activeChatTargetId = data.senderId;
            document.getElementById('chatTargetName').innerText = data.senderName;
            document.getElementById('chatBox').classList.remove('hidden');
            appendChatMessage(data.senderName, data.message, false);
        });

        function appendChatMessage(sender, text, isMe) {
            const box = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `p-2 rounded-xl text-[11px] ${isMe ? 'bg-yellow-400/20 text-yellow-200 text-right ml-6 border border-yellow-400/30' : 'bg-blue-900/80 text-white mr-6 border border-white/10'}`;
            msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight;
        }

        // Leaderboard Local Memory
        let playerStats = JSON.parse(localStorage.getItem('smashLeaderboard')) || [
            { name: "KartKing", games: 48 },
            { name: "TurboTerror", games: 36 },
            { name: "NitroNinja", games: 29 },
            { name: "BlastBandit", games: 18 }
        ];

        function renderLeaderboard() {
            const list = document.getElementById('leaderboardList');
            list.innerHTML = '';
            playerStats.sort((a, b) => b.games - a.games);

            playerStats.forEach((player, index) => {
                const badgeIcons = ['🥇', '🥈', '🥉', '🛡️', '🛡️', '🛡️'];
                const row = document.createElement('div');
                row.className = 'smash-card rounded-2xl p-4 flex justify-between items-center text-white';
                row.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl bg-blue-950/60 flex items-center justify-center font-bold text-yellow-300">
                            ${badgeIcons[index] || '🛡️'} #${index + 1}
                        </div>
                        <span class="font-black text-base sm:text-lg">${player.name}</span>
                    </div>
                    <div class="bg-blue-950/50 px-4 py-1.5 rounded-xl border border-white/10 text-xs font-bold text-blue-100">
                        🎮 ${player.games} Matches Played
                    </div>
                `;
                list.appendChild(row);
            });
        }

        function registerOrUpdatePlayer(username, addGames = 1) {
            let cleanName = username.trim().length > 0 ? username.trim() : "Untitled";
            let found = playerStats.find(p => p.name.toLowerCase() === cleanName.toLowerCase());
            if (found) {
                found.games += addGames;
            } else {
                playerStats.push({ name: cleanName, games: addGames });
            }
            localStorage.setItem('smashLeaderboard', JSON.stringify(playerStats));
            renderLeaderboard();
        }

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
        }

        function createLobby() {
            const playerInput = document.getElementById('accountUsername').value.trim();
            const player = playerInput.length > 0 ? playerInput : "Untitled";
            const smashUrl = document.getElementById('smashUrl').value || "https://smashkarts.io";
            const winCondition = document.getElementById('winCondition').value;

            registerOrUpdatePlayer(player, 1);

            socket.emit('create_room', {
                playerName: player,
                smashUrl: smashUrl,
                winCondition: winCondition
            });
        }

        socket.on('room_created', (data) => {
            document.getElementById('roomDetails').classList.remove('hidden');
            document.getElementById('displayRoomId').innerText = data.roomId;
            if (data.lobby.smashUrl.includes('smashkarts.io')) {
                setTimeout(() => window.open(data.lobby.smashUrl, '_blank'), 1000);
            }
        });

        // Initial Render
        renderLeaderboard();
    </script>
</body>
</html>
