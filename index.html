<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smash Karts 1v1 Matchmaker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body class="bg-[#121212] text-white flex items-center justify-center min-h-screen">

  <div class="bg-[#1e1e1e] border border-gray-800 rounded-2xl p-8 max-w-md w-full text-center shadow-2xl">
    <h1 class="text-3xl font-extrabold text-[#ff4757] tracking-wider mb-2">SMASH KARTS 1V1</h1>
    <p class="text-gray-400 text-sm mb-6">Online Matchmaking Platform</p>

    <!-- Start Button -->
    <div id="start-box">
      <button onclick="startMatchmaking()" 
              class="w-full bg-[#ff4757] hover:bg-[#e03e4e] text-white font-extrabold py-4 text-xl rounded-xl transition duration-200 shadow-lg tracking-wide">
        PLAY 1V1
      </button>
    </div>

    <!-- Searching Loader -->
    <div id="loading-box" class="hidden py-6">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-[#ff4757] border-t-transparent mb-4"></div>
      <p class="text-lg font-bold text-gray-200">Finding Opponent...</p>
    </div>

    <!-- Host Screen: Create & Send Link -->
    <div id="host-box" class="hidden py-4">
      <h2 class="text-xl font-bold text-yellow-400 mb-2">Match Found! (You are Host)</h2>
      <p class="text-xs text-gray-400 mb-4">Create a room on Smash Karts and paste the link below:</p>
      
      <input type="text" id="room-input" placeholder="https://smashkarts.io/..." 
             class="w-full bg-[#2a2a2a] text-white px-4 py-3 rounded-lg border border-gray-700 mb-3 focus:outline-none focus:border-[#ff4757] text-sm">
      
      <button onclick="sendLink()" 
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">
        SEND LINK TO OPPONENT
      </button>
    </div>

    <!-- Guest Screen: Waiting for Link -->
    <div id="guest-waiting-box" class="hidden py-4">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent mb-2"></div>
      <p class="text-md font-semibold text-gray-300">Match Found!</p>
      <p class="text-xs text-gray-500">Waiting for host to create room link...</p>
    </div>

    <!-- Both Players Screen: Join Room -->
    <div id="join-box" class="hidden py-4">
      <h2 class="text-2xl font-bold mb-2 text-green-400">Match Ready!</h2>
      <p class="text-sm text-gray-300 mb-6">Click below to open your Smash Karts game:</p>
      
      <button onclick="joinGame()" 
              class="w-full bg-green-500 hover:bg-green-600 text-white font-extrabold py-4 rounded-xl text-lg transition shadow-lg">
        JOIN MATCH NOW
      </button>
    </div>

  </div>

  <script>
    const socket = io();
    let currentMatchId = null;
    let targetRoomLink = '';

    function startMatchmaking() {
      document.getElementById('start-box').classList.add('hidden');
      document.getElementById('loading-box').classList.remove('hidden');
      socket.emit('join_queue');
    }

    socket.on('match_found', (data) => {
      document.getElementById('loading-box').classList.add('hidden');
      currentMatchId = data.matchId;

      if (data.role === 'host') {
        document.getElementById('host-box').classList.remove('hidden');
      } else {
        document.getElementById('guest-waiting-box').classList.remove('hidden');
      }
    });

    function sendLink() {
      const rawInput = document.getElementById('room-input').value.trim();
      
      // Automatically extracts only the https:// web address
      const match = rawInput.match(/https?:\/\/[^\s]+/);
      
      if (!match) {
        alert("Please paste a valid Smash Karts link (must include https://)");
        return;
      }

      const cleanLink = match[0];
      socket.emit('send_room_link', { matchId: currentMatchId, link: cleanLink });
    }

    socket.on('receive_room_link', (data) => {
      targetRoomLink = data.link;
      document.getElementById('host-box').classList.add('hidden');
      document.getElementById('guest-waiting-box').classList.add('hidden');
      document.getElementById('join-box').classList.remove('hidden');
    });

    function joinGame() {
      if (targetRoomLink) {
        window.open(targetRoomLink, '_blank');
      } else {
        alert("Room link not found!");
      }
    }
  </script>
</body>
</html>
