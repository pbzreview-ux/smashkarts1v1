<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d67d8" />
  <title>Kart Hub</title>
  <link rel="stylesheet" href="/style.css?v=24.0" />
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div id="toastHost" class="toast-host" aria-live="polite"></div>

  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand" data-action="nav" data-view="home" aria-label="Home">
        <span class="brand-mark">K</span>
        <span class="brand-copy"><b>KART HUB</b><small>Smash Karts launcher</small></span>
      </button>
      <div class="topbar-center">
        <button class="top-pill" data-action="open-command"><span>⌘</span> Commands <kbd>Ctrl K</kbd></button>
        <div class="connection-pill"><span id="connectionDot" class="status-dot"></span><span id="connectionText">Connecting</span></div>
        <div class="top-pill"><span>●</span><span id="onlineCount">0 online</span></div>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" data-action="nav" data-view="social" title="Social">💬</button>
        <button class="icon-btn" data-action="nav" data-view="settings" title="Settings">⚙</button>
        <button id="accountButton" class="account-btn" data-action="account">LOG IN</button>
      </div>
    </header>

    <div class="workspace">
      <aside class="left-rail panel-scroll">
        <section class="profile-card card">
          <button id="profileAvatarButton" class="profile-avatar" data-action="profile"><span id="profileAvatarFallback">P</span><img id="profileAvatarImage" alt="" /></button>
          <div class="profile-main"><b id="profileName">Guest</b><div id="profileBadges" class="badge-row"></div><small id="profileMode">Guest mode</small></div>
          <div class="level-line"><span id="profileLevel">LVL 1</span><span id="profileXp">0 XP</span></div>
          <div class="progress-track"><div id="profileXpBar" class="progress-fill"></div></div>
          <div class="rating-grid">
            <div><small>1v1</small><b id="rating1v1">1000</b></div>
            <div><small>FFA</small><b id="ratingFfa">1000</b></div>
          </div>
        </section>

        <section class="card grind-mini">
          <div class="section-kicker">TODAY'S GRIND</div>
          <div class="mini-stat-grid">
            <div><b id="miniWins">0</b><small>wins</small></div>
            <div><b id="miniLosses">0</b><small>losses</small></div>
            <div><b id="miniKills">0</b><small>kills</small></div>
            <div><b id="miniDeaths">0</b><small>deaths</small></div>
          </div>
          <div class="session-line"><span>Session</span><b id="miniSession">00:00</b></div>
          <button class="secondary wide" data-action="nav" data-view="grind">OPEN GRIND LAB</button>
        </section>

        <section class="card focus-card">
          <div class="section-kicker">FOCUS</div>
          <label>Map / arena<input id="quickMapFocus" class="field" placeholder="Any map" /></label>
          <label>Weapon<input id="quickWeaponFocus" class="field" placeholder="Any weapon" /></label>
          <button class="secondary wide" data-action="save-focus">SAVE FOCUS</button>
        </section>
      </aside>

      <main id="contentViewport" class="content-viewport" tabindex="-1"></main>

      <aside class="right-rail panel-scroll">
        <section class="card quick-card">
          <div class="section-kicker">QUICK LAUNCH</div>
          <button class="play-small" data-action="play-sk">▶ PLAY SK</button>
          <div class="two-col">
            <button class="secondary" data-action="create-room">＋ CREATE</button>
            <button class="secondary" data-action="nav" data-view="public">↪ JOIN</button>
          </div>
        </section>

        <section class="card arena-quick-card">
          <div class="section-kicker">1v1 ARENA</div>
          <button class="queue-btn casual" data-action="queue-1v1" data-type="casual"><b>CASUAL</b><small><span id="casualCount">0</span> searching</small></button>
          <button class="queue-btn ranked" data-action="queue-1v1" data-type="ranked"><b>RANKED</b><small><span id="rankedCount">0</span> searching</small></button>
          <button class="secondary wide" data-action="nav" data-view="arena">OPEN 1v1 ARENA</button>
          <button id="cancelQueueQuick" class="danger wide hidden" data-action="cancel-queue">CANCEL QUEUE</button>
          <div id="quickQueueStatus" class="queue-status">Not searching</div>
        </section>

        <section class="card ffa-quick-card">
          <div class="section-kicker">FFA</div>
          <div class="segmented"><button data-action="set-ffa-size" data-size="12" class="active">12</button><button data-action="set-ffa-size" data-size="24">24</button></div>
          <button class="secondary wide" data-action="play-ffa">FIND FFA</button>
          <button class="secondary wide" data-action="create-ffa">CREATE FFA</button>
        </section>
      </aside>
    </div>

    <nav class="dock" aria-label="Main navigation">
      <button data-action="nav" data-view="home" class="active"><span>⌂</span><small>Home</small></button>
      <button data-action="nav" data-view="arena"><span>⚔</span><small>1v1</small></button>
      <button data-action="nav" data-view="ffa"><span>🔥</span><small>FFA</small></button>
      <button data-action="nav" data-view="grind"><span>◎</span><small>Grind</small></button>
      <button data-action="nav" data-view="stats"><span>▥</span><small>Stats</small></button>
      <button data-action="nav" data-view="coach"><span>◉</span><small>Coach</small></button>
      <button data-action="nav" data-view="social"><span>●</span><small>Social</small></button>
      <button data-action="nav" data-view="tournaments"><span>♛</span><small>Events</small></button>
      <button data-action="nav" data-view="features"><span>✦</span><small>Vault</small></button>
    </nav>
  </div>

  <section id="gameShell" class="game-shell hidden" aria-label="Game">
    <div id="gameBar" class="game-bar">
      <div class="game-bar-left"><button class="game-brand" data-action="exit-game">← HUB</button><span id="gameRoomLabel">SMASH KARTS</span></div>
      <div class="game-bar-center"><span id="gameStatus">Playing</span></div>
      <div class="game-bar-right">
        <button data-action="copy-room">COPY CODE</button>
        <button data-action="nav-game-settings">BAR OPTIONS</button>
        <button data-action="exit-game">EXIT</button>
      </div>
    </div>
    <iframe id="gameFrame" title="Smash Karts" allow="autoplay; fullscreen" referrerpolicy="no-referrer"></iframe>
  </section>

  <div id="modalLayer" class="modal-layer hidden" role="presentation">
    <div id="modalCard" class="modal-card" role="dialog" aria-modal="true"></div>
  </div>

  <div id="commandPalette" class="command-layer hidden">
    <div class="command-card">
      <input id="commandInput" class="field command-input" placeholder="Type a command…" autocomplete="off" />
      <div id="commandResults" class="command-results"></div>
    </div>
  </div>

  <input id="avatarFileInput" type="file" accept="image/png,image/jpeg,image/webp" hidden />
  <script src="/script.js?v=24.0"></script>
</body>
</html>
